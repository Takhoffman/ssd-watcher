name: Agent storage detector
description: Request support for a new agent tool or changed database layout.
title: "[Detector]: "
labels:
  - detector
  - enhancement
body:
  - type: input
    id: project
    attributes:
      label: Project
      description: Link to the authoritative public source repository.
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: v1.2.3 or commit SHA
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Documented storage layout
      description: Link to source lines or documentation that define database paths and environment overrides.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Write behavior
      description: Which database files grow during normal use, and are WAL files used?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach a database, prompts, responses, credentials, or private path information.
          required: true
