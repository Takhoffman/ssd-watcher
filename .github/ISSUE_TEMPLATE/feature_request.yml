name: Feature request
description: Suggest a focused improvement to the product or interface.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a successful experience would feel like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional—mention another tool or workflow that partly helps.
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: This can remain local, read-only, and free of analytics.
          required: true
