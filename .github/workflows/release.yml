name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create release keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keychain="$RUNNER_TEMP/ssd-watcher-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Store notarization credentials
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$PRIVATE_KEY" > "$key_file"
          xcrun notarytool store-credentials SSDWatcherNotary \
            --key "$key_file" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID"

      - name: Prepare Sparkle key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle_key_file="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_KEY" > "$sparkle_key_file"
          chmod 600 "$sparkle_key_file"
          printf 'SPARKLE_PRIVATE_KEY_FILE=%s\n' "$sparkle_key_file" >> "$GITHUB_ENV"

      - name: Build signed and notarized release
        env:
          NOTARYTOOL_PROFILE: SSDWatcherNotary
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SSD-Watcher-*.dmg \
            dist/SSD-Watcher-*.zip \
            dist/appcast.xml \
            dist/SHA256SUMS \
            dist/Casks/ssd-watcher.rb \
            --generate-notes \
            --verify-tag
