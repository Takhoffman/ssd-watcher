name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify tag and release inputs
        run: scripts/check-release.sh "${GITHUB_REF_NAME#v}"

      - name: Test release source
        run: make test

  release:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create release keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keychain="$RUNNER_TEMP/ssd-watcher-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Store notarization credentials
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s' "$PRIVATE_KEY" > "$key_file"
          xcrun notarytool store-credentials SSDWatcherNotary \
            --key "$key_file" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID"

      - name: Prepare Sparkle key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle_key_file="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_KEY" > "$sparkle_key_file"
          chmod 600 "$sparkle_key_file"
          printf 'SPARKLE_PRIVATE_KEY_FILE=%s\n' "$sparkle_key_file" >> "$GITHUB_ENV"

      - name: Build signed and notarized release
        env:
          NOTARYTOOL_PROFILE: SSDWatcherNotary
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/SSD-Watcher-*.dmg \
            dist/SSD-Watcher-*.zip \
            dist/appcast.xml \
            dist/SHA256SUMS \
            dist/Casks/ssd-watcher.rb \
            --title "SSD Watcher $version" \
            --notes-file "release-notes/$version.md" \
            --verify-tag

      - name: Check Homebrew tap publishing
        id: tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -n "$TAP_DEPLOY_KEY" ]]; then
            printf '%s\n' "enabled=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Homebrew Cask
        if: steps.tap.outputs.enabled == 'true'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          key_file="$RUNNER_TEMP/homebrew-tap-deploy-key"
          known_hosts="$RUNNER_TEMP/homebrew-tap-known-hosts"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          curl --fail --silent --show-error https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          test -s "$known_hosts"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$key_file"' EXIT
          ssh-add "$key_file"
          export GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts"
          HOMEBREW_TAP_GIT_URL=git@github.com:Takhoffman/homebrew-tap.git \
            scripts/publish-cask.sh dist/Casks/ssd-watcher.rb

      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/ssd-watcher-signing.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
